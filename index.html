
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KALAMNOVA AI - Smart Learning</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5ff;
            color: #172554;
        }
        header {
            background: #172554;
            color: white;
            padding: 22px;
            text-align: center;
        }
        main {
            max-width: 750px;
            margin: 40px auto;
            padding: 20px;
            text-align: center;
        }
        .card {
            background: white;
            padding: 25px;
            margin: 20px 0;
            border-radius: 14px;
            box-shadow: 0 4px 15px #0001;
        }
        input, button {
            padding: 12px;
            margin: 6px;
            border-radius: 7px;
            border: 1px solid #cbd5e1;
        }
        button {
            background: #4f46e5;
            color: white;
            cursor: pointer;
            border: none;
        }
        li {
            margin: 10px;
            text-align: left;
        }
    </style>
</head>
<body>
    <header>
        <h1>KALAMNOVA AI</h1>
        <p>Learn Smarter. Grow Faster.</p>
    </header>

    <main>
        <h2>Welcome to Your Smart Learning Space!</h2>
        <p>A learning platform designed for school and college students.</p>

        <div class="card">
            <h2>My Study Planner</h2>
            <input id="task" type="text" placeholder="Enter your study task">
            <button onclick="addTask()">Add Task</button>
            <ul id="taskList"></ul>
        </div>

        <div class="card">
            <h2>Our Future Features</h2>
            <p>AI Study Assistant</p>
            <p>Personalized Study Plans</p>
            <p>Practice Quizzes</p>
            <p>Progress Tracking</p>
        </div>
    </main>

    <script>
        function addTask() {
            const input = document.getElementById("task");
            const value = input.value.trim();

            if (value === "") {
                alert("Please enter a task!");
                return;
            }

            const item = document.createElement("li");
            item.textContent = value;
            document.getElementById("taskList").appendChild(item);
            input.value = "";
        }
    </script>
</body>
</html>
